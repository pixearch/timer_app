<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Pomodoro Timer</title>
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Digital Font: Share Tech Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme: Orange */
            --theme-color: #ff9f00; 
            --theme-glow: rgba(255, 159, 0, 0.5);
            --theme-dim: rgba(255, 159, 0, 0.1);
        }

        body {
            background-color: #050505;
            font-family: 'Share Tech Mono', monospace;
            color: var(--theme-color);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: color 0.3s ease;
        }
        
        /* Theme-aware scrollbars */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .glow-text {
            text-shadow: 0 0 5px var(--theme-glow), 0 0 10px var(--theme-dim);
        }

        .glow-box {
            box-shadow: 0 0 15px var(--theme-dim), inset 0 0 20px rgba(0,0,0,0.5);
            border: 3px solid var(--theme-color);
            background-color: #000;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 10; /* Ensure box is behind active tab bottom overlap */
        }

        .inner-box {
            border: 2px solid var(--theme-color);
            background-color: var(--theme-dim);
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .btn-digital {
            background-color: #1a1a1a;
            border: 2px solid var(--theme-color);
            color: var(--theme-color);
            transition: all 0.1s;
            text-transform: uppercase;
            box-shadow: 0 0 5px var(--theme-dim);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }
        .btn-digital:active {
            background-color: var(--theme-color);
            color: #000;
            box-shadow: 0 0 15px var(--theme-glow);
        }
        .btn-digital:hover {
            box-shadow: 0 0 10px var(--theme-glow);
        }

        /* Tabs styling */
        .tab-btn {
            background: #111;
            border: 1px solid var(--theme-dim);
            color: var(--theme-color);
            opacity: 0.6;
            transition: all 0.2s;
            border-bottom: none;
            margin-right: 4px;
        }
        .tab-btn.active {
            background: #000;
            border: 3px solid var(--theme-color);
            border-bottom: 3px solid #000; /* Visual trick to merge with box */
            opacity: 1;
            box-shadow: 0 -5px 15px var(--theme-dim);
            position: relative;
            z-index: 20; /* Sit on top of box border */
            margin-bottom: -3px; /* Overlap the box border */
            padding-bottom: 15px; /* Extend padding to cover overlap */
        }
        .tab-btn:hover {
            opacity: 0.9;
            background: #1a1a1a;
        }

        /* Dynamic Input Borders */
        .theme-border {
            border-color: var(--theme-color);
            color: var(--theme-color);
            transition: border-color 0.3s ease, color 0.3s ease;
        }
        .theme-border:focus {
            outline: none;
            box-shadow: 0 0 5px var(--theme-glow);
        }
        
        /* Select Dropdown Styling */
        select {
            background-color: #000;
            border-color: var(--theme-color);
            color: var(--theme-color);
        }

        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* Removed static transform, handled by JS for dynamic scaling */
        #root {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-2 sm:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ExpandIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        );

        const CollapseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        );

        const CUSTOM_LIBRARY = [
            { id: 'spaceship_ping', name: 'Spaceship Ping', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/spaceship_ping_alert.WAV' },
            { id: 'anomaly', name: 'Anomaly', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Anomaly.WAV' },
            { id: 'big_signal', name: 'Big Signal', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Big%20Signal.WAV' },
            { id: 'calm_alert', name: 'Calm Alert', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Calm%20Alert.WAV' },
            { id: 'casual', name: 'Casual', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Casual.WAV' },
            { id: 'congrats', name: 'Time Complete - Congrats', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Time%20Complete%20-%20Congrats.mp3' },
            { id: 'break_over', name: 'Break Time Is Over', url: 'https://raw.githubusercontent.com/pixearch/timer_app/timer_app/Break%20Time%20Is%20Over.mp3' }
        ];

        const THEMES = {
            orange: { color: '#ff9f00', glow: 'rgba(255, 159, 0, 0.5)', dim: 'rgba(255, 159, 0, 0.1)' },
            red:    { color: '#ff003c', glow: 'rgba(255, 0, 60, 0.5)',   dim: 'rgba(255, 0, 60, 0.1)' },
            green:  { color: '#00ff41', glow: 'rgba(0, 255, 65, 0.5)',   dim: 'rgba(0, 255, 65, 0.1)' },
            blue:   { color: '#00f0ff', glow: 'rgba(0, 240, 255, 0.5)',  dim: 'rgba(0, 240, 255, 0.1)' },
            pink:   { color: '#ff00ff', glow: 'rgba(255, 0, 255, 0.5)',  dim: 'rgba(255, 0, 255, 0.1)' },
            purple: { color: '#bc13fe', glow: 'rgba(188, 19, 254, 0.5)', dim: 'rgba(188, 19, 254, 0.1)' }
        };

        const COMMON_TIMEZONES = [
            'UTC', 'Pacific/Honolulu', 'America/Anchorage', 'America/Los_Angeles', 'America/Denver', 'America/Phoenix', 'America/Chicago', 'America/Mexico_City', 'America/New_York', 'America/Toronto', 'America/Bogota', 'America/Caracas', 'America/Santiago', 'America/Sao_Paulo', 'America/Argentina/Buenos_Aires', 'America/St_Johns', 'Atlantic/Azores', 'Europe/London', 'Europe/Dublin', 'Europe/Lisbon', 'Europe/Paris', 'Europe/Berlin', 'Europe/Madrid', 'Europe/Rome', 'Europe/Amsterdam', 'Europe/Brussels', 'Europe/Vienna', 'Europe/Warsaw', 'Europe/Zurich', 'Europe/Athens', 'Europe/Helsinki', 'Europe/Istanbul', 'Europe/Moscow', 'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos', 'Asia/Dubai', 'Asia/Tehran', 'Asia/Karachi', 'Asia/Kolkata', 'Asia/Dhaka', 'Asia/Bangkok', 'Asia/Jakarta', 'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Singapore', 'Asia/Manila', 'Asia/Taipei', 'Asia/Seoul', 'Asia/Tokyo', 'Australia/Perth', 'Australia/Adelaide', 'Australia/Sydney', 'Australia/Melbourne', 'Australia/Brisbane', 'Pacific/Auckland', 'Pacific/Fiji'
        ];

        // --- Audio Engine ---
        const audioCtxRef = { current: null };
        const getAudioContext = () => {
            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtxRef.current = new AudioContext();
            }
            return audioCtxRef.current;
        };

        const App = () => {
            const [timers, setTimers] = useState([
                { 
                    id: 1, 
                    name: 'TIMER 1', 
                    h: 0, m: 25, s: 0, 
                    timeLeft: 1500, 
                    initialTime: 1500,
                    soundType: 'spaceship_ping',
                    customFile: null
                }
            ]);
            const [activeTabIndex, setActiveTabIndex] = useState(0);
            
            const [isRunning, setIsRunning] = useState(false);
            const [isRinging, setIsRinging] = useState(false);
            const [isLoopMode, setIsLoopMode] = useState(false);
            const [isFocusMode, setIsFocusMode] = useState(false);
            
            const [currentTheme, setCurrentTheme] = useState('orange');
            const [timeZone, setTimeZone] = useState(Intl.DateTimeFormat().resolvedOptions().timeZone);
            const [currentTime, setCurrentTime] = useState(new Date());

            const timerRef = useRef(null);
            const customAudioRef = useRef(null);

            const activeTimer = timers[activeTabIndex];

            // --- Dynamic Scaling Hook ---
            useEffect(() => {
                const handleResize = () => {
                    const root = document.getElementById('root');
                    if (!root) return;

                    const windowHeight = window.innerHeight;
                    const thresholdHeight = 900; // Height where we start shrinking below 0.9
                    
                    const baseScale = 0.90; // Current size
                    const minScale = baseScale * 0.8; // 80% of current size (0.72)

                    let newScale = baseScale;

                    if (windowHeight < thresholdHeight) {
                        // Calculate ratio based on available height
                        const ratio = windowHeight / thresholdHeight;
                        // Apply ratio to base scale
                        newScale = baseScale * ratio;
                    }

                    // Clamp scale: Max 0.90, Min 0.72
                    newScale = Math.min(baseScale, Math.max(minScale, newScale));
                    
                    root.style.transform = `scale(${newScale})`;
                };

                window.addEventListener('resize', handleResize);
                handleResize(); // Initial trigger

                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const tick = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(tick);
            }, []);

            useEffect(() => {
                const root = document.documentElement;
                const theme = THEMES[currentTheme];
                root.style.setProperty('--theme-color', theme.color);
                root.style.setProperty('--theme-glow', theme.glow);
                root.style.setProperty('--theme-dim', theme.dim);
            }, [currentTheme]);

            useEffect(() => {
                if (isRunning && activeTimer.timeLeft > 0) {
                    timerRef.current = setInterval(() => {
                        setTimers(prev => prev.map((t, i) => {
                            if (i === activeTabIndex) {
                                return { ...t, timeLeft: t.timeLeft - 1 };
                            }
                            return t;
                        }));
                    }, 1000);
                } else if (activeTimer.timeLeft === 0 && isRunning) {
                    setIsRunning(false);
                    setIsRinging(true);
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isRunning, activeTabIndex, activeTimer.timeLeft]);

            const calculateTotalSeconds = (h, m, s) => (parseInt(h || 0) * 3600) + (parseInt(m || 0) * 60) + parseInt(s || 0);

            const updateActiveTimer = (updates) => {
                setTimers(prev => prev.map((t, i) => {
                    if (i === activeTabIndex) {
                        const updated = { ...t, ...updates };
                        if (updates.h !== undefined || updates.m !== undefined || updates.s !== undefined) {
                            if (!isRunning && !isRinging) {
                                const total = calculateTotalSeconds(updated.h, updated.m, updated.s);
                                updated.timeLeft = total;
                                updated.initialTime = total;
                            }
                        }
                        return updated;
                    }
                    return t;
                }));
            };

            const updateActiveTimerSound = (type, file) => {
                setTimers(prev => prev.map((t, i) => {
                    if (i === activeTabIndex) {
                        return { 
                            ...t, 
                            soundType: type, 
                            customFile: file !== undefined ? file : t.customFile 
                        };
                    }
                    return t;
                }));
            };

            const handleInputChange = (type, val) => {
                let v = parseInt(val); if (isNaN(v)) v = 0;
                let { h, m, s } = activeTimer;
                if (type === 'h') { if (v > 24) v = 24; if (v < 0) v = 0; h = v; }
                if (type === 'm') { if (v > 59) v = 59; if (v < 0) v = 0; m = v; }
                if (type === 's') { if (v > 59) v = 59; if (v < 0) v = 0; s = v; }
                updateActiveTimer({ h, m, s });
            };

            const adjustTime = (type, amount) => {
                let { h, m, s } = activeTimer;
                if (type === 'h') { h += amount; if (h > 24) h = 0; if (h < 0) h = 24; }
                if (type === 'm') { m += amount; if (m > 59) m = 0; if (m < 0) m = 59; }
                if (type === 's') { s += amount; if (s > 59) s = 0; if (s < 0) s = 59; }
                updateActiveTimer({ h, m, s });
            };

            const handleNameChange = (e) => {
                updateActiveTimer({ name: e.target.value });
            };

            const addTab = () => {
                if (timers.length < 4) {
                    setTimers(prev => [
                        ...prev, 
                        { 
                            id: Date.now(), 
                            name: 'NEW TIMER', 
                            h: 0, m: 25, s: 0, 
                            timeLeft: 1500, 
                            initialTime: 1500,
                            soundType: 'spaceship_ping',
                            customFile: null
                        }
                    ]);
                }
            };

            const removeTab = (e, index) => {
                e.stopPropagation();
                if (timers.length > 1) {
                    const newTimers = timers.filter((_, i) => i !== index);
                    setTimers(newTimers);
                    if (activeTabIndex >= index && activeTabIndex > 0) {
                        setActiveTabIndex(activeTabIndex - 1);
                    }
                }
            };

            const stopAudio = () => {
                if (customAudioRef.current) {
                    customAudioRef.current.pause();
                    customAudioRef.current.currentTime = 0;
                    customAudioRef.current = null;
                }
            };

            const playAudioSource = (src) => {
                stopAudio(); // Crucial: Stop any existing audio before playing new
                if (!src) return;
                try {
                    const audio = new Audio(src); 
                    audio.loop = true;
                    audio.play().catch(e => console.log("Audio play failed", e));
                    customAudioRef.current = audio;
                } catch (err) { console.error("Error playing audio source", err); }
            };

            useEffect(() => {
                if (isRinging) {
                    const currentSoundType = activeTimer.soundType;
                    const currentCustomFile = activeTimer.customFile;
                    
                    if (currentSoundType === 'upload' && currentCustomFile) {
                        playAudioSource(URL.createObjectURL(currentCustomFile));
                    } else {
                        const preset = CUSTOM_LIBRARY.find(s => s.id === currentSoundType);
                        if (preset) playAudioSource(preset.url);
                    }
                } else {
                    stopAudio();
                }
            }, [isRinging, activeTimer.soundType, activeTimer.customFile]);

            const handleFileChange = (e) => { 
                if (e.target.files && e.target.files[0]) {
                    updateActiveTimerSound('upload', e.target.files[0]);
                }
            };

            const startTimer = () => {
                if (isRinging) return;
                if (activeTimer.timeLeft === 0) {
                     const newTime = calculateTotalSeconds(activeTimer.h, activeTimer.m, activeTimer.s);
                     if (newTime > 0) { 
                         updateActiveTimer({ timeLeft: newTime, initialTime: newTime });
                         setIsRunning(true); 
                     }
                } else {
                     setIsRunning(true);
                }
            };

            const pauseTimer = () => setIsRunning(false);
            
            const resetTimer = () => { 
                setIsRunning(false); 
                setIsRinging(false); 
                const t = calculateTotalSeconds(activeTimer.h, activeTimer.m, activeTimer.s); 
                updateActiveTimer({ timeLeft: t, initialTime: t });
            };

            const stopAlarm = () => {
                setIsRinging(false);
                stopAudio();

                const t = calculateTotalSeconds(activeTimer.h, activeTimer.m, activeTimer.s); 
                updateActiveTimer({ timeLeft: t, initialTime: t });

                if (isLoopMode) {
                    const nextIndex = (activeTabIndex + 1) % timers.length;
                    setActiveTabIndex(nextIndex);
                    setTimeout(() => {
                        setTimers(prev => prev.map((timer, i) => {
                            if (i === nextIndex) {
                                const total = calculateTotalSeconds(timer.h, timer.m, timer.s);
                                return { ...timer, timeLeft: total, initialTime: total };
                            }
                            return timer;
                        }));
                        setIsRunning(true);
                    }, 100);
                }
            };

            const previewSound = () => {
                 stopAudio();
                 
                 let src = null;
                 if (activeTimer.soundType === 'upload' && activeTimer.customFile) {
                    src = URL.createObjectURL(activeTimer.customFile);
                 } else {
                    const preset = CUSTOM_LIBRARY.find(s => s.id === activeTimer.soundType);
                    if (preset) src = preset.url;
                 }

                 if (src) {
                     const audio = new Audio(src);
                     // Store ref so we can stop it if clicked again
                     customAudioRef.current = audio;
                     audio.play().catch(e => console.log("Preview failed", e));
                     
                     // Increased timeout to 10s to ensure longer clips play fully
                     setTimeout(() => {
                         // Only pause if this specific audio instance is still the current one
                         if (customAudioRef.current === audio) {
                             audio.pause();
                             customAudioRef.current = null;
                         }
                     }, 10000);
                 }
            };

            const getFormattedTime = () => {
                try {
                    return new Intl.DateTimeFormat('en-US', { timeZone: timeZone, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true }).format(currentTime);
                } catch(e) { return "--:--:--"; }
            };
            const getFormattedDate = () => {
                try {
                    return new Intl.DateTimeFormat('en-US', { timeZone: timeZone, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }).format(currentTime);
                } catch(e) { return "---, --- -- ----"; }
            };

            const formatDisplay = (sec) => {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                return {
                    h: h.toString().padStart(2, '0'),
                    m: m.toString().padStart(2, '0'),
                    s: s.toString().padStart(2, '0')
                };
            };

            const display = formatDisplay(activeTimer.timeLeft);

            return (
                <div className={`w-full ${isFocusMode ? 'h-full flex items-center justify-center' : 'max-w-3xl flex flex-col items-start gap-0'}`}>
                    
                    {/* Tabs Section - Outside the Main Box */}
                    {!isFocusMode && (
                        <div className="w-full flex gap-2 px-4 items-end overflow-x-auto z-0" style={{ marginBottom: '-3px' }}>
                            {timers.map((tab, idx) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTabIndex(idx)}
                                    className={`tab-btn flex-1 py-4 px-6 rounded-t-lg text-base sm:text-lg font-bold uppercase whitespace-nowrap flex justify-between items-center gap-2 ${idx === activeTabIndex ? 'active' : ''}`}
                                >
                                    <span className="truncate">{tab.name}</span>
                                    {timers.length > 1 && (
                                        <span onClick={(e) => removeTab(e, idx)} className="hover:text-red-500 font-bold px-1 ml-2 text-xl">×</span>
                                    )}
                                </button>
                            ))}
                            {timers.length < 4 && (
                                <button onClick={addTab} className="tab-btn px-6 py-4 rounded-t-lg font-bold text-xl hover:bg-white/10">+</button>
                            )}
                        </div>
                    )}

                    {/* Main Box */}
                    <div className={`w-full relative overflow-hidden flex flex-col transition-all duration-300 z-10 ${isFocusMode ? 'items-center justify-center p-0 min-h-[50vh]' : 'glow-box rounded-xl rounded-tl-none p-6 sm:p-10 gap-8'}`}>
                        <div className="scanline"></div>

                        {/* Exit Focus Mode Button (Outside scaled box) */}
                        {isFocusMode && (
                            <button 
                                onClick={() => setIsFocusMode(false)}
                                className="absolute top-6 right-6 z-50 p-2 opacity-50 hover:opacity-100 transition-opacity text-current cursor-pointer bg-black/40 rounded border border-current"
                                title="Exit Focus Mode"
                            >
                                <CollapseIcon />
                            </button>
                        )}

                        {/* Top Bar: Theme, Status, Clock */}
                        {!isFocusMode && (
                            <div className="flex flex-col border-b-4 theme-border pb-6 z-10 gap-4">
                                <div className="flex justify-between items-center text-base sm:text-lg uppercase font-bold tracking-widest opacity-80">
                                    <div className="flex items-center gap-2">
                                        <label className="opacity-80 font-bold">Theme</label>
                                        <select value={currentTheme} onChange={(e) => setCurrentTheme(e.target.value)} className="bg-black border-2 theme-border uppercase p-2 rounded focus:outline-none cursor-pointer text-base">
                                            {Object.keys(THEMES).map(k => <option key={k} value={k}>{k}</option>)}
                                        </select>
                                    </div>
                                    <div className={`animate-pulse text-lg ${isRinging ? 'text-white' : ''}`}>
                                        {isRinging ? "FINISHED" : isRunning ? "RUNNING" : "READY"}
                                    </div>
                                </div>
                                <div className="flex flex-col items-center justify-center gap-2 text-center">
                                    <select value={timeZone} onChange={(e) => setTimeZone(e.target.value)} className="bg-transparent border-none text-sm uppercase tracking-widest opacity-80 focus:outline-none text-center cursor-pointer hover:opacity-100 mb-1 font-bold">
                                        {COMMON_TIMEZONES.map(tz => <option key={tz} value={tz}>{tz.replace('_', ' ')}</option>)}
                                    </select>
                                    <div className="text-4xl sm:text-6xl font-bold leading-none glow-text tracking-widest">{getFormattedTime()}</div>
                                    <div className="text-lg uppercase tracking-widest opacity-80 font-bold">{getFormattedDate()}</div>
                                </div>
                            </div>
                        )}

                        {/* Mode Toggle & Name Edit */}
                        {!isFocusMode && (
                            <div className="z-10 flex justify-between items-center">
                                <div className="flex flex-col">
                                    <label className="text-sm uppercase opacity-80 font-bold mb-1">Timer Name</label>
                                    <input 
                                        type="text" 
                                        value={activeTimer.name}
                                        onChange={handleNameChange}
                                        className="bg-transparent border-b-2 theme-border text-xl font-bold uppercase focus:outline-none w-48 sm:w-64"
                                    />
                                </div>

                                <div className="relative group">
                                    <button 
                                        onClick={() => setIsLoopMode(!isLoopMode)}
                                        className={`flex items-center gap-3 px-4 py-2 rounded border-2 theme-border transition-all ${isLoopMode ? 'bg-white/20 shadow-[0_0_10px_var(--theme-glow)]' : 'opacity-60'}`}
                                    >
                                        <span className="text-3xl">∞</span>
                                        <div className="flex flex-col items-start leading-none">
                                            <span className="text-xs font-bold">LOOP</span>
                                            <span className="text-xs font-bold">{isLoopMode ? 'ON' : 'OFF'}</span>
                                        </div>
                                    </button>
                                    {/* Tooltip */}
                                    <div className="absolute bottom-full right-0 mb-3 hidden group-hover:block w-64 p-3 bg-black border-2 theme-border rounded shadow-xl z-50 text-xs font-bold tracking-wide leading-relaxed">
                                        WHEN ENABLED, THE NEXT TIMER IN THE LIST WILL AUTOMATICALLY START AFTER THE CURRENT ONE FINISHES.
                                        <div className="absolute -bottom-2 right-6 w-3 h-3 bg-black border-b-2 border-r-2 theme-border transform rotate-45"></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Main Clock */}
                        <div className={`relative z-10 transition-all duration-500 ${isFocusMode ? 'scale-[1.7] p-8 rounded-xl border-2 theme-border bg-black' : 'inner-box p-6 sm:p-10 rounded bg-black/40'} text-center ${isRinging && !isFocusMode ? 'bg-white/10' : ''}`}>
                            {!isFocusMode && (
                                <button 
                                    onClick={() => setIsFocusMode(true)}
                                    className="absolute top-2 right-2 p-1 opacity-40 hover:opacity-100 transition-opacity z-50 text-current cursor-pointer"
                                    title="Enter Focus Mode"
                                >
                                    <ExpandIcon />
                                </button>
                            )}
                            <div className={`flex justify-center items-center text-6xl sm:text-8xl font-bold leading-none tracking-wider tabular-nums ${isRinging ? 'animate-pulse' : 'glow-text'}`}>
                                <div className="w-[1.8ch] flex justify-center">{display.h}</div>
                                {/* Increased padding-bottom (pb-4) to lift the colon higher */}
                                <div className="pb-4 px-1">:</div>
                                <div className="w-[1.8ch] flex justify-center">{display.m}</div>
                                {/* Increased padding-bottom (pb-4) to lift the colon higher */}
                                <div className="pb-4 px-1">:</div>
                                <div className="w-[1.8ch] flex justify-center">{display.s}</div>
                            </div>
                        </div>

                        {/* Controls */}
                        {!isFocusMode && (
                            <div className="z-10 flex flex-col gap-8">
                                <div className="flex flex-col gap-4">
                                    <label className="text-2xl font-bold uppercase opacity-80 border-b-2 theme-border pb-2">Set Duration</label>
                                    <div className="flex justify-between gap-2 sm:gap-6">
                                        {['h', 'm', 's'].map((unit, idx) => (
                                            <React.Fragment key={unit}>
                                                <div className="flex flex-col items-center gap-2 w-full">
                                                    <button onClick={() => adjustTime(unit, 1)} className="btn-digital w-full py-2 text-2xl font-bold">▲</button>
                                                    <input type="number" value={activeTimer[unit]} onChange={(e) => handleInputChange(unit, e.target.value)} className="w-full bg-black border-2 theme-border text-center text-3xl sm:text-5xl font-bold p-2 rounded" />
                                                    <button onClick={() => adjustTime(unit, -1)} className="btn-digital w-full py-2 text-2xl font-bold">▼</button>
                                                    <span className="text-lg font-bold uppercase opacity-80 mt-1">{unit === 'h' ? 'HR' : unit === 'm' ? 'MIN' : 'SEC'}</span>
                                                </div>
                                                {/* Structural Spacer for Perfect Alignment */}
                                                {idx < 2 && (
                                                    <div className="flex flex-col items-center gap-2">
                                                        {/* Invisible button spacer to match the top button's height exactly */}
                                                        <button className="btn-digital py-2 text-2xl font-bold invisible w-4 border-2">▲</button>
                                                        {/* Colon with transparent border to match input's box-model (border-2 + p-2) */}
                                                        <div className="text-3xl sm:text-5xl font-bold p-2 border-2 border-transparent">:</div>
                                                    </div>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-4">
                                    <div className="flex gap-4 items-end">
                                        <div className="flex-grow">
                                            <label className="text-2xl font-bold uppercase opacity-80 block mb-2 border-b-2 theme-border pb-2">Alarm Sound</label>
                                            <select value={activeTimer.soundType} onChange={(e) => updateActiveTimerSound(e.target.value)} className="w-full text-xl font-bold uppercase p-3 border-2 rounded bg-black theme-border focus:outline-none">
                                                <optgroup label="Default">
                                                    {CUSTOM_LIBRARY.map(sound => <option key={sound.id} value={sound.id}>{sound.name.toUpperCase()}</option>)}
                                                </optgroup>
                                                <optgroup label="User">
                                                    <option value="upload">UPLOAD FILE...</option>
                                                </optgroup>
                                            </select>
                                        </div>
                                        <button onClick={previewSound} className="btn-digital w-16 h-[54px] text-3xl font-bold rounded mb-[1px]">♪</button>
                                    </div>
                                    {activeTimer.soundType === 'upload' && (
                                        <div className="animate-fade-in p-4 border-2 theme-border rounded bg-white/5">
                                            <input type="file" accept="audio/*" onChange={handleFileChange} className="block w-full text-sm font-bold file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-white/20 file:text-white hover:file:bg-white/30 theme-border cursor-pointer" />
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-2 gap-6">
                                    {isRinging ? (
                                        <button onClick={stopAlarm} className="col-span-2 btn-digital py-6 text-3xl sm:text-4xl font-bold animate-pulse border-4 rounded">
                                            {isLoopMode ? "NEXT TIMER >>" : "STOP ALARM"}
                                        </button>
                                    ) : (
                                        <>
                                            {!isRunning ? (
                                                <button onClick={startTimer} className="btn-digital py-5 text-2xl font-bold rounded">START</button>
                                            ) : (
                                                <button onClick={pauseTimer} className="btn-digital py-5 text-2xl font-bold rounded bg-white/10">PAUSE</button>
                                            )}
                                            <button onClick={resetTimer} className="btn-digital py-5 text-2xl font-bold opacity-80 hover:opacity-100 rounded">RESET</button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
